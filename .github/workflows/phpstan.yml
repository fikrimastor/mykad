name: PHPStan

on:
  push:
  pull_request:

jobs:
  phpstan:
    name: phpstan
    # PRs from this repo are already covered by the push run on the same commit;
    # only PRs from forks (which never trigger a push here) need the PR run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
